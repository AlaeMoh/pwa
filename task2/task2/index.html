<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="app-header">
        <h1>To do list.</h1>
        <p>Your tasks, on time.</p>
      </header>

      <div class="notif-banner" id="notifBanner">
        <span>Enable notifications to get reminders when tasks are due.</span>
        <button id="notifBtn">Enable</button>
      </div>

      <div class="card">
        <div class="form-group">
          <label for="taskTitle">Task title</label>
          <input
            type="text"
            id="taskTitle"
            placeholder="What do you need to do?"
          />
        </div>

        <div class="row" style="margin-bottom: 14px">
          <div class="form-group">
            <label for="taskHH">Hours</label>
            <input
              type="number"
              id="taskHH"
              min="0"
              max="23"
              placeholder="hh"
            />
          </div>
          <div class="form-group">
            <label for="taskMM">Minutes</label>
            <input
              type="number"
              id="taskMM"
              min="0"
              max="59"
              placeholder="mm"
            />
          </div>
        </div>

        <div class="date-row">
          <div class="form-group">
            <label for="taskDay">Day</label>
            <select id="taskDay"></select>
          </div>
          <div class="form-group">
            <label for="taskMonth">Month</label>
            <select id="taskMonth"></select>
          </div>
          <div class="form-group">
            <label for="taskYear">Year</label>
            <select id="taskYear"></select>
          </div>
        </div>

        <button class="add-btn" id="addTaskBtn">Add Task</button>
      </div>

      <div class="log-card">
        <ul id="logList"></ul>
      </div>

      <div class="tasks-header">
        <h2>Tasks</h2>
      </div>
      <div id="tasksList">
        <p class="empty-msg">No tasks yet.</p>
      </div>
    </div>

    <script src="idb.js"></script>
    <script src="js/db.js"></script>
    <script src="js/notify.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
