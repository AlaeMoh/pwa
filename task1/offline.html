<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --card-bg: rgba(255, 255, 255, 0.92);
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        --radius: 24px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-gradient);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* Ambient floating shapes */
      .bg-shape {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        filter: blur(40px);
        animation: float 14s ease-in-out infinite;
      }
      .shape-1 { width: 320px; height: 320px; top: -60px; left: -80px; animation-delay: 0s; }
      .shape-2 { width: 420px; height: 420px; bottom: -120px; right: -100px; animation-delay: -5s; }
      .shape-3 { width: 180px; height: 180px; top: 45%; right: 12%; animation-delay: -10s; background: rgba(118, 75, 162, 0.25); }

      @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(18px, -18px) scale(1.04); }
      }

      .offline-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 48px 40px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 480px;
        width: 100%;
        text-align: center;
        z-index: 1;
        animation: fadeInUp 0.8s ease-out;
      }

      .icon {
        font-size: 56px;
        margin-bottom: 16px;
        display: inline-block;
        animation: pulse 2.5s ease-in-out infinite;
      }

      h1 {
        font-size: clamp(1.6rem, 4vw, 2.25rem);
        margin-bottom: 12px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      p {
        font-size: 1.1rem;
        color: var(--text-secondary);
        margin-bottom: 32px;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        transition: var(--transition);
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      }

      a:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
      }

      a:active { transform: translateY(0); }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.12); opacity: 0.85; }
      }

      @media (max-width: 600px) {
        .offline-card { padding: 36px 24px; }
        .icon { font-size: 48px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <main class="offline-card">
      <h1>Connection Lost</h1>
      <p>It looks like your device is currently offline. Please verify your network settings and try reloading the page.</p>
      <a href="./pages/index.html">← Go Home</a>
    </main>
  </body>
</html>
