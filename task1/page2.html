<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 2</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --card-bg: rgba(255, 255, 255, 0.92);
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --nav-bg: rgba(255, 255, 255, 0.75);
        --shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        --radius: 20px;
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-gradient);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 24px;
        background: var(--nav-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 50px;
        box-shadow: var(--shadow);
        margin: 24px auto 0;
        max-width: 640px;
        width: 100%;
      }

      nav a {
        text-decoration: none;
        color: var(--accent);
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 99px;
        transition: var(--transition);
        font-size: 15px;
      }

      nav a:hover {
        background: var(--accent);
        color: white;
        transform: translateY(-1px);
      }

      .card {
        background: var(--card-bg);
        padding: 56px 40px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 520px;
        width: 100%;
        margin: auto;
        text-align: center;
        animation: slideUp 0.7s ease-out;
      }

      h1 {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        margin-bottom: 14px;
        letter-spacing: -0.5px;
        line-height: 1.2;
        font-weight: 800;
      }

      p {
        font-size: 1.125rem;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 600px) {
        nav { flex-direction: column; align-items: stretch; gap: 8px; border-radius: 16px; }
        nav a { text-align: center; }
        .card { padding: 40px 24px; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="pages/index.html">Home</a>
      <a href="pages/page1.html">Cashed</a>
      <a href="page2.html">Not Cashed</a>
    </nav>
    <div class="card">
      <h1>Not Cashed</h1>
      <p>This page lives in the root directory.</p>
    </div>
  </body>
</html>
